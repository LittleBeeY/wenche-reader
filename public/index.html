<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="文澈阅读，本地优先的 AI 深度阅读器" />
    <title>文澈阅读</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell" id="app-shell">
      <aside class="sidebar" id="document-sidebar">
        <div class="brand">
          <div class="brand-mark">澈</div>
          <div>
            <h1>文澈阅读</h1>
            <p>AI 深度阅读器</p>
          </div>
          <button
            id="toggle-document-sidebar"
            class="aside-toggle"
            type="button"
            title="收起文档栏"
            aria-label="收起文档栏"
            aria-controls="document-sidebar"
            aria-expanded="true"
          ><span aria-hidden="true">‹</span></button>
        </div>

        <div class="library-source-switch" role="tablist" aria-label="内容来源">
          <button type="button" role="tab" aria-selected="true" data-active="true">本地文章</button>
          <button type="button" role="tab" aria-selected="false" title="RSS 阅读将在后续版本加入" disabled>RSS</button>
        </div>

        <label class="upload-zone" for="file-input">
          <input id="file-input" type="file" accept=".txt,.md,.markdown,.html,.htm,.pdf,.docx,.epub" multiple />
          <span class="upload-icon" aria-hidden="true">+</span>
          <span class="upload-title">导入文章</span>
          <span class="upload-types">TXT MD HTML PDF DOCX EPUB</span>
        </label>

        <details class="sidebar-disclosure import-disclosure">
          <summary>
            <span>导入选项</span>
            <small>可指定初始分类</small>
          </summary>
          <div class="sidebar-disclosure-body import-options">
            <label>
              <span>导入到分类</span>
              <input id="category-input" type="text" list="category-options" maxlength="80" placeholder="例如：待读论文" />
            </label>
            <datalist id="category-options"></datalist>
          </div>
        </details>

        <nav class="document-list" aria-label="文档列表">
          <div class="document-list-toolbar">
            <div>
              <span class="meta-label">文章库</span>
              <strong id="document-title">未选择</strong>
            </div>
            <label class="document-sort-control">
              <span>排序</span>
              <select id="document-sort" aria-label="文章排序">
                <option value="filename">文件名</option>
                <option value="title">文章标题</option>
                <option value="import">导入顺序</option>
              </select>
            </label>
          </div>
          <input id="document-search" class="document-search" type="search" placeholder="搜索标题、文件名或分类" aria-label="搜索文档" />
          <div id="archive-list" class="archive-list" aria-label="归档位置"></div>
          <div id="document-list"></div>
        </nav>

        <details id="library-organize" class="sidebar-disclosure organize-disclosure">
          <summary>
            <span>整理与归档</span>
            <small>批量选择、移动和维护归档</small>
          </summary>
          <div class="sidebar-disclosure-body">
            <div class="document-list-actions">
              <button id="select-visible" type="button" disabled>全选结果</button>
              <button id="delete-selected" type="button" disabled>删除所选</button>
            </div>
            <div class="batch-archive-controls">
              <select id="archive-category" aria-label="选择归档">
                <option value="">选择归档</option>
                <option value="未分类">未分类</option>
              </select>
              <button id="archive-selected" type="button" disabled>放入归档</button>
            </div>
            <div class="archive-create-controls">
              <input id="new-archive-name" type="text" maxlength="80" placeholder="新归档名称" aria-label="新归档名称" />
              <button id="create-archive" type="button" disabled>新建</button>
            </div>
            <div class="archive-manage-actions">
              <button id="rename-archive" type="button" disabled>重命名</button>
              <button id="delete-archive" type="button" disabled>删除归档</button>
            </div>
            <div id="archive-status" class="archive-status" role="status" aria-live="polite"></div>
          </div>
        </details>

        <details class="sidebar-disclosure data-tools" aria-label="本地数据">
          <summary>
            <span>数据与备份</span>
            <small>导出或恢复本地资料库</small>
          </summary>
          <div class="sidebar-disclosure-body">
            <button id="download-backup" type="button">备份</button>
            <label class="restore-button" for="restore-backup">恢复</label>
            <input id="restore-backup" type="file" accept="application/json,.json" />
          </div>
        </details>
      </aside>

      <section class="reader-shell">
        <div class="reader-toolbar">
          <div>
            <span class="section-label">阅读中</span>
            <h2 id="reader-title">上传一篇文章开始阅读</h2>
          </div>
          <div class="reader-search" role="search">
            <input id="reader-search-input" type="search" placeholder="搜索当前文章" aria-label="搜索当前文章" />
            <button id="previous-match" type="button" title="上一个匹配" aria-label="上一个匹配" disabled>↑</button>
            <span id="match-indicator">0 / 0</span>
            <button id="next-match" type="button" title="下一个匹配" aria-label="下一个匹配" disabled>↓</button>
          </div>
          <div class="page-controls" aria-label="分页">
            <details id="reading-settings" class="reading-settings">
              <summary title="阅读设置" aria-label="阅读设置"><span aria-hidden="true">Aa</span></summary>
              <div class="reading-settings-popover" role="group" aria-label="阅读设置选项">
                <div class="reading-setting-row">
                  <span>字号</span>
                  <div class="reading-stepper">
                    <button id="decrease-font" type="button" title="缩小字号" aria-label="缩小字号">−</button>
                    <output id="font-scale" aria-live="polite">100%</output>
                    <button id="increase-font" type="button" title="放大字号" aria-label="放大字号">+</button>
                  </div>
                </div>
                <fieldset>
                  <legend>内容宽度</legend>
                  <div class="reading-segments" data-reading-control="contentWidth">
                    <button type="button" data-value="narrow">窄</button>
                    <button type="button" data-value="standard">标准</button>
                    <button type="button" data-value="wide">宽</button>
                  </div>
                </fieldset>
                <fieldset>
                  <legend>行距</legend>
                  <div class="reading-segments" data-reading-control="lineHeight">
                    <button type="button" data-value="compact">紧凑</button>
                    <button type="button" data-value="comfortable">舒适</button>
                    <button type="button" data-value="relaxed">宽松</button>
                  </div>
                </fieldset>
                <fieldset>
                  <legend>阅读主题</legend>
                  <div class="reading-segments theme-segments" data-reading-control="theme">
                    <button type="button" data-value="light"><span class="theme-swatch theme-light" aria-hidden="true"></span>明亮</button>
                    <button type="button" data-value="eye"><span class="theme-swatch theme-eye" aria-hidden="true"></span>护眼</button>
                    <button type="button" data-value="night"><span class="theme-swatch theme-night" aria-hidden="true"></span>夜间</button>
                  </div>
                </fieldset>
                <button id="reset-reading-settings" class="reading-reset" type="button">恢复默认</button>
              </div>
            </details>
            <button id="immersive-toggle" class="icon-command immersive-command" type="button" title="进入沉浸阅读" aria-label="进入沉浸阅读" aria-pressed="false">⛶</button>
            <button id="bookmark-page" class="icon-command" type="button" title="收藏当前页" aria-label="收藏当前页" disabled>☆</button>
            <button id="prev-page" type="button">上一页</button>
            <span id="page-indicator">0 / 0</span>
            <button id="next-page" type="button">下一页</button>
          </div>
          <div id="status" class="status" role="status"></div>
        </div>

        <article id="reader" class="reader" aria-live="polite"></article>
        <div id="selection-menu" class="selection-menu" hidden>
          <button data-action="remove-annotation" type="button">取消高亮</button>
          <button data-action="highlight" type="button">高亮</button>
          <button data-action="note" type="button">批注</button>
          <button data-action="direct" type="button">解析</button>
          <button data-action="deep" type="button">深入解析</button>
          <button data-action="custom" type="button">自定义问题</button>
        </div>
      </section>

      <aside class="ai-panel" id="ai-panel">
        <div class="ai-header">
          <div class="ai-header-copy">
            <span class="section-label">AI 助手</span>
            <h2>解析面板</h2>
          </div>
          <button
            id="toggle-ai-panel"
            class="aside-toggle"
            type="button"
            title="收起 AI 面板"
            aria-label="收起 AI 面板"
            aria-controls="ai-panel"
            aria-expanded="true"
          ><span aria-hidden="true">›</span></button>
        </div>

        <div class="ai-view-tabs" role="tablist" aria-label="AI 面板视图">
          <button id="analysis-tab" type="button" role="tab" aria-selected="true">解析</button>
          <button id="knowledge-tab" type="button" role="tab" aria-selected="false">沉淀</button>
        </div>

        <div id="analysis-view" class="ai-view">
          <div id="ai-status" class="ai-status">正在检查 AI 接口</div>

          <div class="quick-actions" aria-label="快速解析">
            <button id="explain-page" type="button">解析当前页</button>
            <button id="deep-page" type="button">深入解析当前页</button>
          </div>

          <div class="question-box">
            <textarea id="question-input" rows="4" placeholder="围绕选区或全文提问…"></textarea>
            <div class="question-actions">
              <button id="ask-button" type="button">提问</button>
              <button id="cancel-ai" type="button" hidden>取消解析</button>
            </div>
          </div>

          <div class="answer-toolbar">
            <span>解析记录</span>
            <button id="history-toggle" type="button" hidden>查看全部</button>
          </div>
          <div id="answer-list" class="answer-list"></div>
        </div>

        <div id="knowledge-view" class="ai-view" hidden>
          <div class="knowledge-toolbar">
            <button id="export-current" type="button" title="导出当前文档全部页面的标注与已沉淀回答" disabled>导出本篇沉淀</button>
            <button id="export-all" type="button" title="导出所有文档的标注与已沉淀回答">导出全部沉淀</button>
          </div>
          <section class="knowledge-section">
            <div class="answer-toolbar"><span>当前文章标注</span></div>
            <div id="annotation-list" class="knowledge-list"></div>
          </section>
          <section class="knowledge-section">
            <div class="answer-toolbar"><span>AI 回答沉淀</span></div>
            <div id="knowledge-list" class="knowledge-list"></div>
          </section>
        </div>
      </aside>
    </main>

    <button id="exit-immersive" class="exit-immersive" type="button" title="退出沉浸阅读（Esc）" aria-label="退出沉浸阅读" hidden>×</button>

    <dialog id="annotation-dialog" class="annotation-dialog">
      <form method="dialog">
        <h2>添加批注</h2>
        <blockquote id="annotation-excerpt"></blockquote>
        <label for="annotation-note">批注内容</label>
        <textarea id="annotation-note" rows="5" maxlength="20000" required></textarea>
        <div class="dialog-actions">
          <button value="cancel" type="button" id="cancel-annotation">取消</button>
          <button value="save" type="submit">保存批注</button>
        </div>
      </form>
    </dialog>

    <script src="/vendor/marked.min.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script src="/vendor/jszip.min.js"></script>
    <script src="/vendor/docx-preview.min.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
