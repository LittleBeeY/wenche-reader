<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="文澈阅读，本地优先的 AI 深度阅读器" />
    <title>文澈阅读</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell" id="app-shell">
      <aside class="sidebar" id="document-sidebar">
        <div class="brand">
          <div class="brand-mark">澈</div>
          <div>
            <h1>文澈阅读</h1>
            <p>AI 深度阅读器</p>
          </div>
          <button
            id="toggle-document-sidebar"
            class="aside-toggle"
            type="button"
            title="收起文档栏"
            aria-label="收起文档栏"
            aria-controls="document-sidebar"
            aria-expanded="true"
          ><span aria-hidden="true">‹</span></button>
        </div>

        <div class="library-source-switch" role="tablist" aria-label="内容来源">
          <button id="source-local" type="button" role="tab" aria-selected="true" data-active="true">本地文档</button>
          <button id="source-rss" type="button" role="tab" aria-selected="false">资讯</button>
        </div>

        <nav id="rss-nav" class="rss-nav" aria-label="资讯导航" hidden>
          <div class="rss-nav-section">
            <span class="rss-nav-heading">资讯</span>
            <button type="button" data-rss-scope="today" class="rss-nav-item">今日精选</button>
            <button type="button" data-rss-scope="inbox" class="rss-nav-item">收件箱</button>
            <button type="button" data-rss-scope="later" class="rss-nav-item">稍后读</button>
            <button type="button" data-rss-scope="starred" class="rss-nav-item">收藏</button>
          </div>
          <div class="rss-nav-section">
            <div class="rss-nav-heading-row">
              <span class="rss-nav-heading">订阅</span>
              <button id="rss-nav-add" type="button" class="rss-nav-mini" title="添加订阅" aria-label="添加订阅">＋</button>
            </div>
            <div id="rss-feed-tree" class="rss-feed-tree"></div>
          </div>
          <div class="rss-nav-section">
            <span class="rss-nav-heading">管理</span>
            <button id="rss-nav-manage" type="button" class="rss-nav-item">管理订阅源</button>
            <button id="rss-nav-opml" type="button" class="rss-nav-item">导入 / 导出 OPML</button>
          </div>
          <div class="rss-nav-footer">
            <span id="rss-last-updated" class="rss-last-updated" title="上次更新时间"></span>
            <button id="rss-refresh-all" type="button" class="rss-nav-mini" title="立即刷新" aria-label="立即刷新">⟳ 刷新</button>
            <button id="rss-open-prefs" type="button" class="rss-nav-mini" title="资讯设置" aria-label="资讯设置">⚙ 设置</button>
          </div>
        </nav>

        <label
          class="upload-zone local-only"
          for="file-input"
          title="支持批量添加 TXT、Markdown、HTML、PDF、DOCX 和 EPUB"
        >
          <input id="file-input" type="file" accept=".txt,.md,.markdown,.html,.htm,.pdf,.docx,.epub" multiple />
          <span class="upload-icon" aria-hidden="true">+</span>
          <span class="upload-title">添加文档</span>
          <span class="upload-types">可一次选择多个文件</span>
        </label>

        <details class="sidebar-disclosure import-disclosure local-only">
          <summary>
            <span>导入位置（可选）</span>
          </summary>
          <div class="sidebar-disclosure-body import-options">
            <label>
              <span>保存到文件夹</span>
              <input id="category-input" type="text" list="category-options" maxlength="80" placeholder="默认：无文件夹" />
            </label>
            <datalist id="category-options"></datalist>
          </div>
        </details>

        <nav class="document-list local-only" aria-label="文档列表">
          <div class="document-list-toolbar">
            <span class="document-list-title">文档列表</span>
            <label class="document-sort-control">
              <span class="visually-hidden">排序方式</span>
              <select id="document-sort" aria-label="文章排序">
                <option value="filename">按文件名</option>
                <option value="title">按标题</option>
                <option value="import">按添加时间</option>
              </select>
            </label>
          </div>
          <input id="document-search" class="document-search" type="search" placeholder="搜索文档或文件夹" aria-label="搜索文档" />
          <div id="archive-list" class="archive-list" aria-label="按文件夹筛选"></div>
          <div id="document-list"></div>
        </nav>

        <details id="library-organize" class="sidebar-disclosure organize-disclosure local-only">
          <summary>
            <span>管理文档</span>
          </summary>
          <div class="sidebar-disclosure-body">
            <span class="organize-section-title">选择文档</span>
            <div class="document-list-actions">
              <button id="select-visible" type="button" disabled>选择当前列表</button>
              <button id="delete-selected" type="button" disabled>批量删除</button>
            </div>
            <span class="organize-section-title">移动或管理文件夹</span>
            <div class="batch-archive-controls">
              <select id="archive-category" aria-label="目标文件夹">
                <option value="">移动到文件夹…</option>
                <option value="未分类">无文件夹</option>
              </select>
              <button id="archive-selected" type="button" disabled>移动</button>
            </div>
            <div class="archive-manage-actions">
              <button id="rename-archive" type="button" disabled>重命名文件夹</button>
              <button id="delete-archive" type="button" disabled>删除文件夹</button>
            </div>
            <span class="organize-section-title">新建文件夹</span>
            <div class="archive-create-controls">
              <input id="new-archive-name" type="text" maxlength="80" placeholder="输入文件夹名称" aria-label="新文件夹名称" />
              <button id="create-archive" type="button" disabled>创建</button>
            </div>
            <div id="archive-status" class="archive-status" role="status" aria-live="polite"></div>
          </div>
        </details>

        <details class="sidebar-disclosure data-tools local-only" aria-label="本地数据">
          <summary>
            <span>备份与恢复</span>
          </summary>
          <div class="sidebar-disclosure-body">
            <button id="download-backup" type="button">下载备份</button>
            <label class="restore-button" for="restore-backup">从备份恢复</label>
            <input id="restore-backup" type="file" accept="application/json,.json" />
          </div>
        </details>
      </aside>

      <section id="rss-list-panel" class="rss-list-panel" aria-label="资讯列表" hidden>
        <div class="rss-list-toolbar">
          <div class="rss-list-title-row">
            <button id="rss-list-back" type="button" class="rss-list-back" title="返回资讯列表" aria-label="返回资讯列表">‹</button>
            <h2 id="rss-scope-title">今日精选</h2>
            <button id="rss-list-refresh" type="button" title="刷新" aria-label="刷新">⟳</button>
          </div>
          <input id="rss-list-search" type="search" placeholder="搜索资讯" aria-label="搜索资讯" />
          <div class="rss-list-controls">
            <div class="rss-segments" role="group" aria-label="阅读状态筛选" id="rss-read-filter">
              <button type="button" data-value="unread">未读</button>
              <button type="button" data-value="all">全部</button>
              <button type="button" data-value="read">已读</button>
            </div>
            <div class="rss-segments" role="group" aria-label="排序方式" id="rss-sort-control">
              <button type="button" data-value="smart">智能</button>
              <button type="button" data-value="newest">最新</button>
              <button type="button" data-value="oldest">最旧</button>
            </div>
            <div class="rss-segments" role="group" aria-label="列表视图" id="rss-view-control">
              <button type="button" data-value="compact" title="紧凑视图" aria-label="紧凑视图">☰</button>
              <button type="button" data-value="summary" title="摘要视图" aria-label="摘要视图">☷</button>
              <button type="button" data-value="cards" title="卡片视图" aria-label="卡片视图">▦</button>
            </div>
          </div>
        </div>
        <div id="rss-brief-banner" class="rss-brief-banner" hidden></div>
        <div id="rss-entry-list" class="rss-entry-list" tabindex="0" aria-label="资讯条目"></div>
        <div class="rss-list-footer">
          <button id="rss-load-more" type="button" hidden>加载更多</button>
        </div>
      </section>

      <section class="reader-shell">
        <div id="rss-article-bar" class="rss-article-bar" hidden>
          <div class="rss-article-meta" id="rss-article-meta"></div>
          <div class="rss-article-actions">
            <button type="button" data-rss-action="unread" title="标记未读" aria-label="标记未读">✉</button>
            <button type="button" data-rss-action="star" title="收藏" aria-label="收藏">☆</button>
            <button type="button" data-rss-action="later" title="稍后读" aria-label="稍后读">🕑</button>
            <button type="button" data-rss-action="hide" title="不感兴趣" aria-label="不感兴趣">⊘</button>
            <button type="button" data-rss-action="extract" title="提取全文" aria-label="提取全文">⤓</button>
            <button type="button" data-rss-action="save" title="保存到文档" aria-label="保存到文档">⇥</button>
            <a id="rss-article-origin" href="#" target="_blank" rel="noopener noreferrer" title="打开原文" aria-label="打开原文">↗</a>
          </div>
        </div>
        <div class="reader-toolbar">
          <div>
            <span class="section-label">阅读中</span>
            <h2 id="reader-title">上传一篇文章开始阅读</h2>
          </div>
          <div class="reader-search" role="search">
            <input id="reader-search-input" type="search" placeholder="搜索当前文章" aria-label="搜索当前文章" />
            <button id="previous-match" type="button" title="上一个匹配" aria-label="上一个匹配" disabled>↑</button>
            <span id="match-indicator">0 / 0</span>
            <button id="next-match" type="button" title="下一个匹配" aria-label="下一个匹配" disabled>↓</button>
          </div>
          <div class="page-controls" aria-label="分页">
            <details id="reading-settings" class="reading-settings">
              <summary title="阅读设置" aria-label="阅读设置"><span aria-hidden="true">Aa</span></summary>
              <div class="reading-settings-popover" role="group" aria-label="阅读设置选项">
                <div class="reading-setting-row">
                  <span>字号</span>
                  <div class="reading-stepper">
                    <button id="decrease-font" type="button" title="缩小字号" aria-label="缩小字号">−</button>
                    <output id="font-scale" aria-live="polite">100%</output>
                    <button id="increase-font" type="button" title="放大字号" aria-label="放大字号">+</button>
                  </div>
                </div>
                <fieldset>
                  <legend>内容宽度</legend>
                  <div class="reading-segments" data-reading-control="contentWidth">
                    <button type="button" data-value="narrow">窄</button>
                    <button type="button" data-value="standard">标准</button>
                    <button type="button" data-value="wide">宽</button>
                  </div>
                </fieldset>
                <fieldset>
                  <legend>行距</legend>
                  <div class="reading-segments" data-reading-control="lineHeight">
                    <button type="button" data-value="compact">紧凑</button>
                    <button type="button" data-value="comfortable">舒适</button>
                    <button type="button" data-value="relaxed">宽松</button>
                  </div>
                </fieldset>
                <fieldset>
                  <legend>阅读主题</legend>
                  <div class="reading-segments theme-segments" data-reading-control="theme">
                    <button type="button" data-value="light"><span class="theme-swatch theme-light" aria-hidden="true"></span>明亮</button>
                    <button type="button" data-value="eye"><span class="theme-swatch theme-eye" aria-hidden="true"></span>护眼</button>
                    <button type="button" data-value="night"><span class="theme-swatch theme-night" aria-hidden="true"></span>夜间</button>
                  </div>
                </fieldset>
                <button id="reset-reading-settings" class="reading-reset" type="button">恢复默认</button>
              </div>
            </details>
            <button id="immersive-toggle" class="icon-command immersive-command" type="button" title="进入沉浸阅读" aria-label="进入沉浸阅读" aria-pressed="false">⛶</button>
            <button id="bookmark-page" class="icon-command" type="button" title="收藏当前页" aria-label="收藏当前页" disabled>☆</button>
            <button id="prev-page" type="button">上一页</button>
            <span id="page-indicator">0 / 0</span>
            <button id="next-page" type="button">下一页</button>
          </div>
          <div id="status" class="status" role="status"></div>
        </div>

        <article id="reader" class="reader" aria-live="polite"></article>
        <div id="selection-menu" class="selection-menu" hidden>
          <button data-action="remove-annotation" type="button">取消高亮</button>
          <button data-action="highlight" type="button">高亮</button>
          <button data-action="note" type="button">批注</button>
          <button data-action="direct" type="button">解析</button>
          <button data-action="deep" type="button">深入解析</button>
          <button data-action="custom" type="button">自定义问题</button>
        </div>
      </section>

      <aside class="ai-panel" id="ai-panel">
        <div class="ai-header">
          <div class="ai-header-copy">
            <span class="section-label">AI 助手</span>
            <h2>解析面板</h2>
          </div>
          <button
            id="toggle-ai-panel"
            class="aside-toggle"
            type="button"
            title="收起 AI 面板"
            aria-label="收起 AI 面板"
            aria-controls="ai-panel"
            aria-expanded="true"
          ><span aria-hidden="true">›</span></button>
        </div>

        <div class="ai-view-tabs" role="tablist" aria-label="AI 面板视图">
          <button id="analysis-tab" type="button" role="tab" aria-selected="true">解析</button>
          <button id="knowledge-tab" type="button" role="tab" aria-selected="false">沉淀</button>
        </div>

        <div id="analysis-view" class="ai-view">
          <div id="ai-status" class="ai-status">正在检查 AI 接口</div>

          <div class="quick-actions" aria-label="快速解析">
            <button id="explain-page" type="button">解析当前页</button>
            <button id="deep-page" type="button">深入解析当前页</button>
          </div>

          <div class="quick-actions rss-quick-actions" id="rss-quick-actions" aria-label="资讯快捷解析" hidden>
            <button type="button" data-rss-ai="judge">帮我判断是否值得深读</button>
            <button type="button" data-rss-ai="summary">生成结构化摘要</button>
            <button type="button" data-rss-ai="points">提取观点与证据</button>
          </div>

          <div class="question-box">
            <textarea id="question-input" rows="4" placeholder="围绕选区或全文提问…"></textarea>
            <div class="question-actions">
              <button id="ask-button" type="button">提问</button>
              <button id="cancel-ai" type="button" hidden>取消解析</button>
            </div>
          </div>

          <div class="answer-toolbar">
            <span>解析记录</span>
            <button id="history-toggle" type="button" hidden>查看全部</button>
          </div>
          <div id="answer-list" class="answer-list"></div>
        </div>

        <div id="knowledge-view" class="ai-view" hidden>
          <div class="knowledge-toolbar">
            <button id="export-current" type="button" title="导出当前文档全部页面的标注与已沉淀回答" disabled>导出本篇沉淀</button>
            <button id="export-all" type="button" title="导出所有文档的标注与已沉淀回答">导出全部沉淀</button>
          </div>
          <section class="knowledge-section">
            <div class="answer-toolbar"><span>当前文章标注</span></div>
            <div id="annotation-list" class="knowledge-list"></div>
          </section>
          <section class="knowledge-section">
            <div class="answer-toolbar"><span>AI 回答沉淀</span></div>
            <div id="knowledge-list" class="knowledge-list"></div>
          </section>
        </div>
      </aside>
    </main>

    <button id="exit-immersive" class="exit-immersive" type="button" title="退出沉浸阅读（Esc）" aria-label="退出沉浸阅读" hidden>×</button>

    <dialog id="rss-add-dialog" class="rss-dialog">
      <form method="dialog">
        <h2>添加订阅</h2>
        <p class="rss-dialog-hint">粘贴 RSS / Atom 地址，或网站地址，文澈会自动探测可订阅的来源。</p>
        <label for="rss-add-url">订阅地址或网站地址</label>
        <input id="rss-add-url" type="url" placeholder="https://example.com 或 https://example.com/feed.xml" />
        <div id="rss-add-status" class="rss-dialog-status" role="status"></div>
        <div id="rss-add-candidates" class="rss-candidates"></div>
        <div class="dialog-actions">
          <button value="cancel" type="button" id="rss-add-cancel">取消</button>
          <button value="default" type="button" id="rss-add-discover">探测</button>
        </div>
      </form>
    </dialog>

    <dialog id="rss-opml-dialog" class="rss-dialog">
      <form method="dialog">
        <h2>导入 / 导出 OPML</h2>
        <div class="rss-opml-actions">
          <label class="restore-button" for="rss-opml-file">选择 OPML 文件</label>
          <input id="rss-opml-file" type="file" accept=".opml,.xml,text/xml" />
          <button type="button" id="rss-opml-export">导出当前订阅</button>
        </div>
        <div id="rss-opml-status" class="rss-dialog-status" role="status"></div>
        <div id="rss-opml-preview" class="rss-opml-preview"></div>
        <div class="dialog-actions">
          <button value="cancel" type="button" id="rss-opml-cancel">关闭</button>
          <button value="default" type="button" id="rss-opml-import" disabled>确认导入</button>
        </div>
      </form>
    </dialog>

    <dialog id="rss-feeds-dialog" class="rss-dialog rss-dialog-wide">
      <form method="dialog">
        <h2>管理订阅源</h2>
        <div id="rss-feeds-manage-list" class="rss-feeds-manage-list"></div>
        <div class="rss-folder-create">
          <input id="rss-new-folder-name" type="text" maxlength="80" placeholder="新建订阅分组名称" aria-label="新建订阅分组名称" />
          <button type="button" id="rss-create-folder">创建分组</button>
        </div>
        <div class="dialog-actions">
          <button value="cancel" type="button" id="rss-feeds-close">完成</button>
        </div>
      </form>
    </dialog>

    <dialog id="rss-prefs-dialog" class="rss-dialog">
      <form method="dialog">
        <h2>资讯设置</h2>
        <fieldset>
          <legend>关注主题（每行一个，可带权重，如「Agent:1」）</legend>
          <textarea id="rss-prefs-topics" rows="4" placeholder="AI 工程&#10;Agent:1&#10;深度阅读"></textarea>
        </fieldset>
        <fieldset>
          <legend>屏蔽主题（每行一个）</legend>
          <textarea id="rss-prefs-blocked-topics" rows="2"></textarea>
        </fieldset>
        <div class="rss-prefs-grid">
          <label>每日精选数量
            <input id="rss-prefs-brief-count" type="number" min="3" max="30" />
          </label>
          <label>默认刷新间隔（分钟）
            <input id="rss-prefs-interval" type="number" min="15" max="1440" />
          </label>
        </div>
        <label class="rss-prefs-check">
          <input id="rss-prefs-show-unread" type="checkbox" />
          显示未读数
        </label>
        <label class="rss-prefs-check">
          <input id="rss-prefs-auto-ai" type="checkbox" />
          自动进行 AI 初评（关闭后资讯仍可正常使用）
        </label>
        <label class="rss-prefs-check">
          <input id="rss-prefs-explore" type="checkbox" />
          今日精选中保留一条探索性内容
        </label>
        <label class="rss-prefs-check">
          <input id="rss-prefs-longform" type="checkbox" />
          偏好长文
        </label>
        <div class="dialog-actions">
          <button value="cancel" type="button" id="rss-prefs-cancel">取消</button>
          <button value="default" type="button" id="rss-prefs-save">保存设置</button>
        </div>
      </form>
    </dialog>

    <dialog id="annotation-dialog" class="annotation-dialog">
      <form method="dialog">
        <h2>添加批注</h2>
        <blockquote id="annotation-excerpt"></blockquote>
        <label for="annotation-note">批注内容</label>
        <textarea id="annotation-note" rows="5" maxlength="20000" required></textarea>
        <div class="dialog-actions">
          <button value="cancel" type="button" id="cancel-annotation">取消</button>
          <button value="save" type="submit">保存批注</button>
        </div>
      </form>
    </dialog>

    <script src="/vendor/marked.min.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script src="/vendor/jszip.min.js"></script>
    <script src="/vendor/docx-preview.min.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
